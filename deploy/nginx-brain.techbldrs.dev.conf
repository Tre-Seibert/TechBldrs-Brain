# nginx vhost for tb-brain's MCP endpoint (brain.techbldrs.dev -> 127.0.0.1:8765).
# Install: sudo cp deploy/nginx-brain.techbldrs.dev.conf /etc/nginx/sites-available/brain.techbldrs.dev
#          sudo ln -s /etc/nginx/sites-available/brain.techbldrs.dev /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d brain.techbldrs.dev      (adds the 443 listener and the redirect, like the other sites)
#
# Only /mcp* is reachable from outside. The app's other routes (/health, /tools, /v1) stay on loopback.

limit_req_zone $binary_remote_addr zone=tbbrain:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name brain.techbldrs.dev;

    location /mcp {
        limit_req zone=tbbrain burst=30 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tool calls can take a while ("all clients" questions); keep the connection open for them.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # No buffering, so a streamed reply (if the client asks for SSE) is not held back.
        proxy_buffering off;
        client_max_body_size 2m;
    }

    location / {
        return 404;
    }
}
