# Open WebUI only. Chat goes to tb-brain on the host (:8765), which calls local Ollama.
# Does not install OpenClaw. Does not point the UI at Ollama :11434.
#
# Runtime data uses a named Docker volume (tb-brain-open-webui), not a bind
# mount into this OneDrive repo.
#
# Prerequisites:
#   1. .\scripts\run.ps1 listening on the host at http://127.0.0.1:8765
#   2. Ollama on the host for tb-brain's LLM_BASE_URL. Do not store models in this repo.
#
#   docker compose up -d
#   http://127.0.0.1:3000
#   Pick model tb-brain. /v1/models always advertises that id.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: tb-brain-open-webui
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      WEBUI_NAME: tb-brain lab
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://host.docker.internal:8765/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-tb-brain-lab}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
    name: tb-brain-open-webui
